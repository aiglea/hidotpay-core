name: hidotpay-temporal-development

services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: temporal
      POSTGRES_PASSWORD: temporal-development-only
      POSTGRES_USER: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - temporal-development-postgres:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.31.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_PWD: temporal-development-only
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:17233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:18080:8080"

volumes:
  temporal-development-postgres:
