name: hidotpay-redpanda-development

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --set
      - auto_create_topics_enabled=false
      - --set
      - default_topic_replications=1
      - --smp
      - "1"
      - --default-log-level=warn
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --brokers=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      rpk topic create hidotpay.events.v1 --brokers=redpanda:9092 --partitions=3 --replicas=1
      || rpk topic describe hidotpay.events.v1 --brokers=redpanda:9092
    restart: "no"

volumes:
  redpanda-data:
