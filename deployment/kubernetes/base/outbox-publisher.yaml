apiVersion: v1
kind: ServiceAccount
metadata:
  name: outbox-publisher
  namespace: hidotpay-financial
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-publisher
  namespace: hidotpay-financial
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outbox-publisher
    spec:
      serviceAccountName: outbox-publisher
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: outbox-publisher
      terminationGracePeriodSeconds: 30
      containers:
        - name: publisher
          image: ghcr.io/hidotpay/outbox-publisher:0.2.42
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          env:
            - name: OUTBOX_PUBLISHER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: hidotpay-outbox-publisher
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: outbox-publisher
  namespace: hidotpay-financial
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-publisher
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: outbox-publisher
  namespace: hidotpay-financial
spec:
  minReplicas: 3
  maxReplicas: 12
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: outbox-publisher
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: outbox-publisher-private-egress
  namespace: hidotpay-financial
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: outbox-publisher
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              hidotpay.io/plane: infrastructure
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 26257
