apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-read-model-worker
  namespace: hidotpay-financial
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: admin-read-model-worker
  namespace: hidotpay-financial
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: admin-read-model-worker
        spec:
          serviceAccountName: admin-read-model-worker
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: projector
              image: ghcr.io/hidotpay/admin-read-model-worker:0.2.51
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: hidotpay-admin-read-model-worker
              volumeMounts:
                - name: cockroach-ca
                  mountPath: /var/run/hidotpay/cockroach-ca
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
          volumes:
            - name: cockroach-ca
              secret:
                secretName: hidotpay-admin-read-model-worker-ca
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-read-model-worker-private-egress
  namespace: hidotpay-financial
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: admin-read-model-worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              hidotpay.io/plane: infrastructure
      ports:
        - protocol: TCP
          port: 26257
        - protocol: TCP
          port: 443
