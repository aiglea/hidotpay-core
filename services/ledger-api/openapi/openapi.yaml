openapi: 3.1.0
info:
  title: HidoTPay Financial Core API
  version: 0.2.44
  description: |
    中央託管帳本的第一階段 API。金額一律使用最小單位字串；不可使用小數或浮點數。
    本文件不包含私鑰、簽名或鏈上廣播能力。
servers:
  - url: https://api.hidotpay.example/v1
security:
  - bearerAuth: []
paths:
  /me/transactions:
    get:
      summary: 讀取已登入使用者的錢包交易紀錄
      description: |
        帳戶僅由已驗證登入身分在伺服器端導出；請求不得傳入帳戶 ID。
        cursor 為不透明分頁游標，應原樣帶回下一頁請求。回應只包含交易識別、類型、資產、最小單位金額、收支方向與建立時間；不含交易對手、metadata、付款資料、鏈上地址或雜湊。
      parameters:
        - $ref: '#/components/parameters/WalletTransactionLimit'
        - $ref: '#/components/parameters/WalletTransactionCursor'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletTransactionPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/balances:
    get:
      summary: 讀取本人帳戶餘額
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200': { description: 成功 }
        '403': { $ref: '#/components/responses/Error' }
  /wallet-addresses:
    post:
      summary: 取得本人在指定鏈的固定充值地址
      description: 只可為本人可用帳戶配置；地址由私有 signer 衍生，API 不持有任何私鑰材料。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletAddressRequest' }
      responses:
        '200': { description: 已配置或回傳既有地址 }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /internal-transfers:
    post:
      summary: HidoTPay 內部轉帳（不產生鏈上手續費）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalTransfer' }
      responses:
        '201': { description: 已入帳 }
        '200': { description: 同一請求重送，回傳原結果 }
        '409': { $ref: '#/components/responses/Error' }
  /deposits/confirmed:
    post:
      summary: 鏈上確認後，由鏈上工作程序入帳
      description: 僅 chain_worker 角色可呼叫；以 network、transaction_hash、output_index 去重。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmedDeposit' }
      responses:
        '201': { description: 已入帳 }
        '200': { description: 已處理過同一筆鏈上收款 }
  /withdrawals:
    post:
      summary: 建立提現並凍結款項
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawalRequest' }
      responses:
        '201': { description: 等待審核 }
        '200': { description: 同一請求重送，回傳原結果 }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /withdrawal-fee-quotes:
    post:
      summary: 取得短效、一次性的提現手續費報價
      description: 報價會綁定登入用戶、鏈、資產與提款金額；提現時必須帶回 fee_quote_id，且不得重複使用。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawalFeeQuoteRequest' }
      responses:
        '201': { description: 報價已建立 }
        '409': { $ref: '#/components/responses/Error' }
  /withdrawals/{withdrawalId}/approve:
    post:
      summary: 核准提現
      description: 僅 finance_reviewer 角色可呼叫。
      parameters:
        - $ref: '#/components/parameters/WithdrawalId'
      responses:
        '200': { description: 已核准 }
  /p2p/ads:
    get:
      summary: 取得可用的 P2P 廣告
      security: []
      responses:
        '200': { description: 成功 }
    post:
      summary: 以登入身分刊登 P2P 賣出廣告
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2PAdRequest' }
      responses:
        '201': { description: 已建立廣告 }
  /p2p/orders:
    get:
      summary: 讀取本人作為買方或賣方的 P2P 訂單
      responses:
        '200': { description: 成功 }
    post:
      summary: 建立 P2P 訂單並把賣方資產鎖入獨立託管帳戶
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2POrderRequest' }
      responses:
        '201': { description: 訂單已建立並完成託管鎖定 }
        '409': { $ref: '#/components/responses/Error' }
  /p2p/orders/{orderId}/mark-paid:
    post:
      summary: 買方標記已完成法幣付款
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 等待賣方放幣 }
  /p2p/orders/{orderId}/cancel:
    post:
      summary: 賣方於付款前取消訂單並退款
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 託管資產已退回賣方 }
  /p2p/orders/{orderId}/release:
    post:
      summary: 賣方放行託管資產給買方
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 資產已入帳買方 }
  /p2p/orders/{orderId}/disputes:
    post:
      summary: 買賣任一方開啟爭議
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2PDisputeRequest' }
      responses:
        '200': { description: 已開啟爭議，託管資產保持鎖定 }
  /p2p/orders/{orderId}/resolution:
    post:
      summary: 仲裁員裁決放幣或退款
      description: 僅 p2p_arbitrator 角色可呼叫。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2PResolutionRequest' }
      responses:
        '200': { description: 裁決已寫入不可變帳本 }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    WithdrawalId: { name: withdrawalId, in: path, required: true, schema: { type: string, format: uuid } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
    WalletTransactionLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    WalletTransactionCursor:
      name: cursor
      in: query
      required: false
      description: 不透明游標；只可使用前一頁回應的 next_cursor 原樣傳回。
      schema: { type: string, minLength: 1, maxLength: 1024 }
  responses:
    Error:
      description: 錯誤
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    WalletTransactionPage:
      type: object
      additionalProperties: false
      required: [transactions, next_cursor]
      properties:
        transactions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, type, asset_code, amount_atoms, direction, created_at]
            properties:
              id: { type: string, format: uuid }
              type: { type: string, example: internal_transfer }
              asset_code: { type: string, example: USDT }
              amount_atoms: { type: string, pattern: '^[1-9][0-9]*$', example: '1000000' }
              direction: { type: string, enum: [incoming, outgoing] }
              created_at: { type: string, format: date-time }
        next_cursor:
          type: [string, 'null']
          description: 下一頁的不透明游標；最後一頁為 null。
    InternalTransfer:
      type: object
      additionalProperties: false
      required: [asset_code, amount_atoms, from_account_id, to_account_id]
      properties:
        asset_code: { type: string, example: USDT }
        amount_atoms: { type: string, pattern: '^[1-9][0-9]*$', example: '1000000' }
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
    WalletAddressRequest:
      type: object
      additionalProperties: false
      required: [account_id, network]
      properties:
        account_id: { type: string, format: uuid }
        network: { type: string, example: ethereum-sepolia }
    ConfirmedDeposit:
      type: object
      additionalProperties: false
      required: [network, transaction_hash, output_index, asset_code, destination_account_id, amount_atoms, confirmation_count, contract_identifier, block_height, block_hash]
      properties:
        network: { type: string, example: ethereum }
        transaction_hash: { type: string }
        contract_identifier: { type: string, description: 已驗證的原生資產或代幣合約識別 }
        block_height: { type: string, pattern: '^[1-9][0-9]*$' }
        block_hash: { type: string }
        output_index: { type: integer, minimum: 0 }
        asset_code: { type: string, example: USDT }
        destination_account_id: { type: string, format: uuid }
        amount_atoms: { type: string, pattern: '^[1-9][0-9]*$' }
        confirmation_count: { type: integer, minimum: 1 }
    WithdrawalRequest:
      type: object
      additionalProperties: false
      required: [network, destination_address, asset_code, amount_atoms, fee_quote_id, from_account_id, frozen_account_id]
      properties:
        network: { type: string, example: ethereum }
        destination_address: { type: string }
        asset_code: { type: string, example: USDT }
        amount_atoms: { type: string, pattern: '^[1-9][0-9]*$' }
        fee_quote_id: { type: string, format: uuid }
        from_account_id: { type: string, format: uuid }
        frozen_account_id: { type: string, format: uuid }
    WithdrawalFeeQuoteRequest:
      type: object
      additionalProperties: false
      required: [network, asset_code, amount_atoms]
      properties:
        network: { type: string, example: ethereum }
        asset_code: { type: string, example: USDT }
        amount_atoms: { type: string, pattern: '^[1-9][0-9]*$' }
    P2PAdRequest:
      type: object
      additionalProperties: false
      required: [asset_code, fiat_currency, price_atoms, min_amount_atoms, max_amount_atoms, payment_method_code]
      properties:
        asset_code: { type: string, example: USDT }
        fiat_currency: { type: string, example: TWD }
        price_atoms: { type: string, pattern: '^[1-9][0-9]*$' }
        min_amount_atoms: { type: string, pattern: '^[1-9][0-9]*$' }
        max_amount_atoms: { type: string, pattern: '^[1-9][0-9]*$' }
        payment_method_code: { type: string, example: bank_transfer, description: 支付方式代碼，不可包含帳號或個人資料 }
    P2POrderRequest:
      type: object
      additionalProperties: false
      required: [ad_id, amount_atoms]
      properties:
        ad_id: { type: string, format: uuid }
        amount_atoms: { type: string, pattern: '^[1-9][0-9]*$' }
    P2PDisputeRequest:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code: { type: string, example: payment_disputed }
    P2PResolutionRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { type: string, enum: [release_to_buyer, refund_to_seller] }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: insufficient_funds }
        message: { type: string, example: 請求無法處理 }
